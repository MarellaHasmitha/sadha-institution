
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadha Institution - Transform Through Breath and Movement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fcfaf7;
            color: #4a443d;
        }
        .sand-gradient {
            background: linear-gradient(135deg, #f5f2eb 0%, #ede6d9 100%);
        }
        .premium-shadow {
            box-shadow: 0 10px 30px -10px rgba(194, 178, 128, 0.3);
        }
        @keyframes bounce-in {
            0% { transform: translateY(100%) scale(0.9); opacity: 0; }
            70% { transform: translateY(-10%) scale(1.02); opacity: 1; }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes scale-in {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fade-in-down {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes shrink {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
        .animate-bounce-in {
            animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .animate-scale-in {
            animation: scale-in 0.3s ease-out forwards;
        }
        .animate-fade-in-down {
            animation: fade-in-down 0.4s ease-out forwards;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fcfaf7;
        }
        ::-webkit-scrollbar-thumb {
            background: #c2b280;
            border-radius: 4px;
        }
    </style>
